<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delaware XC GPX Test</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 0;
      padding: 14px;
      font-size: 22px;
    }

    #map {
      height: 600px;
      width: 100%;
    }
  </style>
</head>
<body>

  <h1>Delaware XC GPX Test</h1>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-gpx@1.7.0/gpx.js"></script>

  <script>
    var map = L.map('map').setView([39.2, -75.5], 8);

   var street = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors'
  }
);

var topo = L.tileLayer(
  'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
  {
    attribution: 'Map data © OpenStreetMap contributors | Map style © OpenTopoMap'
  }
);

topo.addTo(map);

var baseMaps = {
  "Topo / Contours": topo,
  "Street Map": street
};

L.control.layers(baseMaps).addTo(map);

    new L.GPX('test-walk.gpx', {
      async: true
    }).on('loaded', function(e) {
      map.fitBounds(e.target.getBounds());
    }).addTo(map);
  </script>

</body>
</html>
